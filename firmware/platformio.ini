; M5 Smart-Home Remote — M5Stack Cardputer (ADV and original)
;
; Two environments on purpose:
;   cardputer  the real thing (ESP32-S3, needs hardware to run)
;   native     the pure core, compiled and tested on the host
;
; Everything deterministic lives in lib/core and is exercised by `pio test -e
; native`. The Arduino shell (display, keyboard, Wi-Fi, IR timing) stays a thin
; adapter on top and is verified on the device, not in CI.

[platformio]
default_envs = cardputer

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -std=gnu++17
    -Wall

[env:cardputer]
platform = espressif32 @ ^6.9.0
board = m5stack-stamps3          ; the Cardputer is a StampS3 carrier
framework = arduino
lib_deps =
    ${env.lib_deps}
    m5stack/M5Cardputer @ ^1.1.1  ; supports Cardputer and Cardputer-ADV
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
; Produces m5-smarthome-full.bin (+ .sha256) next to firmware.bin on every
; build, so the thing people flash is never a forgotten manual step.
extra_scripts = post:merge_bin.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -DM5SH_NATIVE=1
    -I lib/core
