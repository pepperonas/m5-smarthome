# Lets every Python suite run from the repository root:
#
#     python3 -m pytest
#
# Without the pythonpath entry, collecting gateway/tests from here fails to
# import m5gw — and a collection error looks a lot like "no tests", which is
# how a suite quietly stops being run.
[pytest]
testpaths = gateway/tests tools/tests
pythonpath = gateway
addopts = -q
