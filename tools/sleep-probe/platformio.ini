; Standalone probe: does the keyboard controller actually wake the ESP32,
; how long does a usable wake take, and what does the device draw asleep?
;
; The whole remote architecture rests on the answer, so it gets measured
; before anything is built on top of it.
[env:probe]
platform = espressif32 @ ^6.9.0
board = m5stack-stamps3
framework = arduino
lib_deps = m5stack/M5Cardputer @ ^1.1.1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -std=gnu++17
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
