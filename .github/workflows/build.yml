name: build

# Binaries are published from CI, not from somebody's laptop: what a release
# contains should be reproducible from the commit it names.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach binaries to a release

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The ESP32 toolchain is a large download; without this every run
      # spends minutes re-fetching an unchanged compiler.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install tooling
        run: |
          pip install --upgrade platformio
          pip install flask pytest

      - name: Gateway tests
        working-directory: gateway
        run: python -m pytest -q

      - name: Firmware core tests (host)
        working-directory: firmware
        run: pio test -e native

      # A test you have never seen fail is not an assurance, so CI breaks each
      # load-bearing guarantee on purpose and requires the suite to notice.
      - name: Mutation probes
        run: |
          python tools/mutate.py gateway
          python tools/mutate.py firmware

      # The IR table is generated from the canonical CSV. If a regenerated
      # table differs from what is committed, the two have drifted — and a
      # drifted IR table fails silently on the device.
      - name: IR table is in sync with its source
        run: |
          python tools/gen_ir_table.py
          git diff --exit-code firmware/lib/core/ir_teufel.h

      - name: Build firmware
        working-directory: firmware
        run: pio run -e cardputer

      - name: Build sleep probe
        working-directory: tools/sleep-probe
        run: pio run -e probe

      - name: Collect binaries
        run: |
          mkdir -p dist
          B=firmware/.pio/build/cardputer
          cp $B/m5-smarthome.bin dist/
          cp $B/m5-smarthome-esptool-full.bin dist/
          cp $B/bootloader.bin dist/
          cp $B/partitions.bin dist/
          cp tools/sleep-probe/.pio/build/probe/firmware.bin dist/sleep-probe.bin
          ( cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      # The launcher path is how most people install firmware on a Cardputer,
      # and handing it the wrong file produces a device with nothing to run.
      # Assert on the bytes rather than trusting the filename.
      - name: The launcher binary is a real application image
        run: |
          python - <<'PY'
          import sys
          for name, want_app in (("dist/m5-smarthome.bin", True),
                                 ("dist/sleep-probe.bin", True),
                                 ("dist/m5-smarthome-esptool-full.bin", False)):
              head = open(name, "rb").read(0x24)
              magic = int.from_bytes(head[0x20:0x24], "little")
              is_app = head[0] == 0xE9 and magic == 0xABCD5432
              print(f"{name}: app image = {is_app}")
              if is_app != want_app:
                  sys.exit(f"{name} is {'not ' if want_app else ''}an app image "
                           f"but was published as one")
          PY

      # Every commit on main leaves a downloadable build, so there is always
      # something current to flash even between releases.
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: m5-smarthome-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Which file do I want?

            **`m5-smarthome.bin`** — the normal one. Copy it to the SD card and
            install it from M5Launcher / Bruce, exactly like any other
            Cardputer firmware. This is also the file OTA takes.

            **`m5-smarthome-esptool-full.bin`** — only for flashing over USB
            with esptool or M5Burner. It contains the bootloader and partition
            table as well and replaces everything on the device:

            ```bash
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              write_flash 0x0 m5-smarthome-esptool-full.bin
            ```

            Do **not** hand the full image to a launcher: it writes the file
            into an app partition, where a bootloader is not a valid
            application, and the device comes up with nothing to run.

            `sleep-probe.bin` is the measurement sketch, also a normal app
            image, so the launcher takes it too. Flash it **first**: it
            answers whether the keyboard controller really wakes the ESP32
            from deep sleep, which is what the whole power design rests on.
            See `docs/MEASURE.md`.

            Verify a download against `SHA256SUMS`.
